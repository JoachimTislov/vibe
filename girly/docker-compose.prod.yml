  # Social Service - Production
  social-service:
    image: girly/social-service:latest
    container_name: girly-social-service-prod
    environment:
      MICRONAUT_ENVIRONMENTS: prod
      MICRONAUT_APPLICATION_NAME: social-service
      DATABASE_URL: jdbc:postgresql://postgres:5432/girly
      DATABASE_USER: ${DB_USER:girly}
      DATABASE_PASSWORD: ${DB_PASSWORD:girly2024}
      DATABASE_SCHEMA: social_svc
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8080
      PET_SERVICE_URL: http://pet-service:8080
      LOG_LEVEL: INFO
    ports:
      - "8006:8080"
    networks:
      - girly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.social-service.rule=PathPrefix(`/api/v1/social`, `/api/v1/games`, `/api/v1/friends`)"
      - "traefik.http.routers.social-service.entrypoints=websecure"
      - "traefik.http.routers.social-service.tls=true"
      - "traefik.http.services.social-service.loadbalancer.server.port=8080"
