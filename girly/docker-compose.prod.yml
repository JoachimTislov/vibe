version: '3.8'

# Production deployment configuration
# Uses production-ready settings and optimizations

include:
  - docker-compose.infra.yml

services:
  # User Service - Production
  user-service:
    image: girly/user-service:latest
    container_name: girly-user-service-prod
    environment:
      MICRONAUT_ENVIRONMENTS: prod
      MICRONAUT_APPLICATION_NAME: user-service
      DATABASE_URL: jdbc:postgresql://postgres:5432/girly
      DATABASE_USER: ${DB_USER:girly}
      DATABASE_PASSWORD: ${DB_PASSWORD:girly2024}
      DATABASE_SCHEMA: user_svc
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: INFO
    ports:
      - "8001:8080"
    networks:
      - girly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/v1/users`, `/api/v1/auth`)"
      - "traefik.http.routers.user-service.entrypoints=websecure"
      - "traefik.http.routers.user-service.tls=true"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

