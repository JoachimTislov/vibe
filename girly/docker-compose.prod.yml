      - "traefik.http.routers.aggregate-service.rule=PathPrefix(`/api/v1/aggregate`, `/api/v1/dashboard`, `/api/v1/analytics`)"
      - "traefik.http.routers.aggregate-service.entrypoints=websecure"
      - "traefik.http.routers.aggregate-service.tls=true"
      - "traefik.http.services.aggregate-service.loadbalancer.server.port=8080"
