plugins {
    id 'java-library'
    id 'io.micronaut.library' version '4.3.0'
}

micronaut {
    version = '4.3.3'
    processing {
        incremental = true
        annotations "com.girly.models.*"
    }
}

group = 'com.girly'
version = '0.1.0-SNAPSHOT'

description = 'Girly Models Library - Shared DTOs, entities, and data structures across all microservices'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Micronaut
    implementation "io.micronaut:micronaut-inject:$micronautVersion"
    implementation "io.micronaut:micronaut-runtime:$micronautVersion"
    
    // Validation
    implementation "javax.validation:validation-api:$javaxValidationVersion"
    implementation "io.micronaut:micronaut-validation:$micronautValidationVersion"
    
    // JSON
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.16.1"
    
    // JPA
    implementation "jakarta.persistence:jakarta.persistence-api:3.1.0"
    
    // Common library
    implementation project(':lib:girly-common')
    
    // Lombok (optional)
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    
    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
}

test {
    useJUnitPlatform()
}
