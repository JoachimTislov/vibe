version: '3.8'

# Development deployment - All services with hot-reload
# Extends the infrastructure stack

include:
  - docker-compose.infra.yml

services:
  # ========== Phase 1: Foundation ==========

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: girly-user-service
    environment:
      MICRONAUT_ENVIRONMENTS: dev
      MICRONAUT_APPLICATION_NAME: user-service
      DATABASE_URL: jdbc:postgresql://postgres:5432/girly
      DATABASE_USER: girly
      DATABASE_PASSWORD: girly2024
      DATABASE_SCHEMA: user_svc
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-please-change-in-production
      TRAEFIK_TAGS: user-service
    ports:
      - "8001:8080"
    networks:
      - girly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/v1/users`, `/api/v1/auth`)"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.services.user-service.loadbalancer.server.port=8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

