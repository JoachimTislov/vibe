services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      DISCOUNT_SOURCES: ${DISCOUNT_SOURCES:-}
    volumes: ["shopping-data:/data"]
    restart: unless-stopped
volumes:
  shopping-data:

