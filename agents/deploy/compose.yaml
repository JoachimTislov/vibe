# VPS deployment for the personal agent.
#
#   GOOGLE_API_KEY=... docker compose up -d
#
# The API binds to 127.0.0.1 only: reach it through a reverse proxy
# (Caddy/nginx) or a Cloudflare Tunnel, never expose 8080 directly.
services:
  agent:
    build: ..
    image: personal-agent
    restart: unless-stopped
    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set MISTRAL_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workspace:/workspace
